version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: biomaxxx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: biomaxxx
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biomaxxx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biomaxxx-network

  # -------------------------------------------------------------
  # 2. Node.js Express + Socket.io Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: biomaxxx-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:password@postgres:5432/biomaxxx
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - biomaxxx-network

  # -------------------------------------------------------------
  # 3. Nginx + React Frontend Client Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: biomaxxx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - biomaxxx-network

volumes:
  postgres_data:
    driver: local

networks:
  biomaxxx-network:
    driver: bridge
